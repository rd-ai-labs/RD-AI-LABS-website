
name: RD AI Labs - Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rd-ai-labs-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Approve and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Get website code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Request production approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: rd-ai-labs
          minimum-approvals: 1
          issue-title: "Approve RD AI Labs production deployment"
          issue-body: "Please review the production deployment for the main branch. Comment approve to deploy or deny to cancel."
          fail-on-denial: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=rd-ai-labs-website --branch=main
