name: RD AI Labs - Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Build the website on every push to main
  build:
    name: Build website
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout website code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: website-dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # 2. Tell you the build result (GitHub comment + GitHub email)
  notify_build:
    name: Notify build result
    runs-on: ubuntu-24.04
    needs: build
    if: always() && needs.build.result != 'skipped'
    permissions:
      contents: write

    steps:
      - name: Comment on commit
        uses: actions/github-script@v8
        env:
          RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const url = process.env.RUN_URL;
            const body = process.env.RESULT === 'success'
              ? '✅ Build successful. Waiting for your approval.\n\nOpen the issue "Deploy approval needed" and comment: approve\n\nRun: ' + url
              : '❌ Build failed. Production was NOT deployed.\n\nLogs: ' + url;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });

  # 3. Wait for your approval: comment "approve" or "deny" on the issue
  approval:
    name: Wait for approval
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 120
    permissions:
      issues: write
      contents: read

    steps:
      - name: Wait for approval comment
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: rd-ai-labs,logalakshmidbn97-png
          minimum-approvals: 1
          issue-title: "Deploy approval needed: run #${{ github.run_number }}"
          issue-body: |
            Build succeeded. Production has NOT been deployed yet.

            Comment **approve** to deploy to Cloudflare.
            Comment **deny** to cancel.

            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # 4. Deploy to Cloudflare Pages (only after approval)
  deploy:
    name: Production deployment
    runs-on: ubuntu-24.04
    needs: [build, approval]
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: rd-ai-labs-production
      cancel-in-progress: false

    steps:
      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: website-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=rd-ai-labs-website --branch=main

  # 5. Tell you the deployment result (GitHub comment + GitHub email)
  notify_deploy:
    name: Notify deployment result
    runs-on: ubuntu-24.04
    needs: [approval, deploy]
    if: always() && needs.approval.result != 'skipped'
    permissions:
      contents: write

    steps:
      - name: Comment on commit
        uses: actions/github-script@v8
        env:
          DEPLOY: ${{ needs.deploy.result }}
          APPROVAL: ${{ needs.approval.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const url = process.env.RUN_URL;
            let body;
            if (process.env.DEPLOY === 'success') {
              body = '🚀 Deployed to production: https://rd-ai-labs-website.pages.dev\n\nRun: ' + url;
            } else if (process.env.APPROVAL !== 'success') {
              body = '⛔ Not deployed: approval was denied, timed out or cancelled.\n\nRun: ' + url;
            } else {
              body = '❌ Production deployment failed.\n\nLogs: ' + url;
            }
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });
