
name: RD AI Labs - Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rd-ai-labs-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Production Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Verify project owner
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref }}
        run: |
          if [ "$ACTOR" != "rd-ai-labs" ]; then
            echo "ERROR: Only rd-ai-labs can deploy to production."
            exit 1
          fi

          if [ "$BRANCH" != "refs/heads/main" ]; then
            echo "ERROR: Deployment must be started from main."
            exit 1
          fi

          echo "Project owner verified."

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'workflow_dispatch' && github.actor == 'rd-ai-labs' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=rd-ai-labs-website --branch=main

  notification:
    name: Send Deployment Result Email
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Send build-ready email
        if: github.event_name == 'push' && needs.deploy.result == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_EMAIL }}
          password: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          subject: "READY: RD AI Labs build successful - Approval required"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: RD AI Labs Deployment
          body: |
            RD AI Labs build completed successfully.
            Production has NOT been deployed yet.

            To deploy:
            Open GitHub Actions, select this workflow,
            click Run workflow, select main, and run it.

            Workflow:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send build failure email
        if: github.event_name == 'push' && needs.deploy.result == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_EMAIL }}
          password: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          subject: "FAILED: RD AI Labs build"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: RD AI Labs Deployment
          body: |
            RD AI Labs build failed.
            Production was NOT deployed.
            Please check GitHub Actions logs.

            Workflow:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send deployment success email
        if: github.event_name == 'workflow_dispatch' && needs.deploy.result == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_EMAIL }}
          password: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          subject: "SUCCESS: RD AI Labs deployed to Cloudflare"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: RD AI Labs Deployment
          body: |
            RD AI Labs website was successfully deployed to Cloudflare Pages.

            Website: https://rd-ai-labs-website.pages.dev

            Workflow:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send deployment failure email
        if: github.event_name == 'workflow_dispatch' && needs.deploy.result == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_EMAIL }}
          password: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          subject: "FAILED: RD AI Labs production deployment"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: RD AI Labs Deployment
          body: |
            RD AI Labs production deployment failed or was not authorized.
            Please check GitHub Actions logs.

            Workflow:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
