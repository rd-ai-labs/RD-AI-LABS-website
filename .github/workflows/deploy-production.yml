name: RD AI Labs - Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1. BUILD: every push to main
  # ---------------------------------------------------------------
  build:
    name: Build website
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout website code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: website-dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------
  # 2. BUILD RESULT NOTIFICATION (email + GitHub commit comment)
  #    Runs right after build, while deploy waits for approval
  # ---------------------------------------------------------------
  notify_build:
    name: Notify build result
    runs-on: ubuntu-24.04
    needs: build
    if: always() && needs.build.result != 'skipped'
    permissions:
      contents: write   # needed only to post a commit comment

    steps:
      - name: Email - build ready, approval required
        if: needs.build.result == 'success'
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.titan.email
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_EMAIL }}
          password: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          subject: "READY: RD AI Labs build successful - Approval required"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.NOTIFY_EMAIL }}
          body: |
            RD AI Labs build completed successfully.
            Production has NOT been deployed yet.

            To deploy: GitHub created an issue named
            "Deploy approval needed" and notified you.
            Open it and comment:  approve
            (you can also reply "approve" to the GitHub email).
            To cancel, comment:  deny

            Workflow:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Email - build failed
        if: needs.build.result == 'failure'
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.titan.email
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_EMAIL }}
          password: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          subject: "FAILED: RD AI Labs build"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.NOTIFY_EMAIL }}
          body: |
            RD AI Labs build failed.
            Production was NOT deployed.

            Workflow:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: GitHub notification (commit comment)
        uses: actions/github-script@v8
        env:
          RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const ok = process.env.RESULT === 'success';
            const body = ok
              ? `✅ Build successful. **Waiting for your approval.** Comment `approve` on the new issue to deploy.\n\n[Run details](${process.env.RUN_URL})`
              : `❌ Build failed. Production was NOT deployed.\n\n[View logs](${process.env.RUN_URL})`;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body
            });

  # ---------------------------------------------------------------
  # 2b. APPROVAL: creates a GitHub issue and WAITS for your comment
  #     Comment "approve" -> deploy continues
  #     Comment "deny"    -> deploy is cancelled
  # ---------------------------------------------------------------
  approval:
    name: Wait for approval
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 120   # waits up to 2 hours, then fails (no deploy)
    permissions:
      issues: write
      contents: read

    steps:
      - name: Wait for approval comment
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: rd-ai-labs
          minimum-approvals: 1
          issue-title: "Deploy approval needed: run #${{ github.run_number }}"
          issue-body: |
            Build succeeded. Production has NOT been deployed yet.

            Comment **approve** to deploy to Cloudflare.
            Comment **deny** to cancel.

            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ---------------------------------------------------------------
  # 3. DEPLOY: pauses for approval (GitHub Environment "production")
  # ---------------------------------------------------------------
  deploy:
    name: Production deployment
    runs-on: ubuntu-24.04
    needs: [build, approval]
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: rd-ai-labs-production
      cancel-in-progress: false

    steps:
      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: website-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=rd-ai-labs-website --branch=main

  # ---------------------------------------------------------------
  # 4. DEPLOY RESULT NOTIFICATION (email + GitHub commit comment)
  # ---------------------------------------------------------------
  notify_deploy:
    name: Notify deployment result
    runs-on: ubuntu-24.04
    needs: [approval, deploy]
    if: always() && needs.approval.result != 'skipped'
    permissions:
      contents: write

    steps:
      - name: Email - deployment success
        if: needs.deploy.result == 'success'
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.titan.email
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_EMAIL }}
          password: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          subject: "SUCCESS: RD AI Labs deployed to Cloudflare"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.NOTIFY_EMAIL }}
          body: |
            RD AI Labs website was successfully deployed to Cloudflare Pages.

            Website: https://rd-ai-labs-website.pages.dev

            Workflow:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Email - deployment failed / rejected / cancelled
        if: needs.deploy.result != 'success'
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.titan.email
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_EMAIL }}
          password: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          subject: "FAILED: RD AI Labs production deployment"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.NOTIFY_EMAIL }}
          body: |
            RD AI Labs production deployment did not complete.
            Approval step: ${{ needs.approval.result }}
            Deploy step: ${{ needs.deploy.result }}
            (approval failure = denied or timed out, nothing was deployed)

            Workflow:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: GitHub notification (commit comment)
        uses: actions/github-script@v8
        env:
          RESULT: ${{ needs.deploy.result == 'success' && 'success' || format('approval={0}, deploy={1}', needs.approval.result, needs.deploy.result) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const ok = process.env.RESULT === 'success';
            const body = ok
              ? `🚀 Deployed to production: https://rd-ai-labs-website.pages.dev\n\n[Run details](${process.env.RUN_URL})`
              : `❌ Production deployment did not complete (${process.env.RESULT}).\n\n[View logs](${process.env.RUN_URL})`;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body
            });
