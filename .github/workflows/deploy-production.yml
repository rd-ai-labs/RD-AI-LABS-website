
name: RD AI Labs - Production Deployment

on:
  # Trigger after a Pull Request is closed and merged into main
  pull_request:
    branches:
      - main
    types:
      - closed

  # Allow manual execution from main only
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. BUILD WEBSITE
  # ==========================================
  build:
    name: Build website
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: website-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # 2. BUILD RESULT NOTIFICATION
  # ==========================================
  notify_build:
    name: Notify build result
    runs-on: ubuntu-24.04
    needs: build

    if: always() && needs.build.result != 'skipped'

    permissions:
      contents: write

    steps:
      - name: Comment build result on commit
        uses: actions/github-script@v8

        env:
          RESULT: ${{ needs.build.result }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

        with:
          script: |
            const url = process.env.RUN_URL;
            const source = process.env.SOURCE_BRANCH;
            const target = process.env.TARGET_BRANCH;
            const run = process.env.RUN_NUMBER;

            let body;

            if (process.env.RESULT === 'success') {
              body = `✅ BUILD SUCCESSFUL

            Source branch: ${source}
            Target branch: ${target}
            Run number: #${run}

            Production deployment is waiting for your approval.

            Workflow logs:
            ${url}`;
            } else {
              body = `❌ BUILD FAILED

            Source branch: ${source}
            Target branch: ${target}
            Run number: #${run}

            Production was NOT deployed.

            Check build logs:
            ${url}`;
            }

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });

  # ==========================================
  # 3. MANUAL PRODUCTION APPROVAL
  # ==========================================
  approval:
    name: Wait for approval
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 120

    permissions:
      issues: write
      contents: read

    steps:
      - name: Request production deployment approval
        uses: trstringer/manual-approval@v1

        with:
          secret: ${{ github.token }}

          approvers: rd-ai-labs,logalakshmidbn97-png
          minimum-approvals: 1

          issue-title: "Deploy approval needed: ${{ github.event.pull_request.head.ref || github.ref_name }} - run #${{ github.run_number }}"

          issue-body: |
            🚀 RD AI Labs Production Deployment Approval Required

            Source branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
            Target branch: ${{ github.event.pull_request.base.ref || 'main' }}

            Repository: ${{ github.repository }}
            Run number: #${{ github.run_number }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}

            Build status: SUCCESS

            Production has NOT been deployed yet.

            To approve:
            Comment **approve**

            To reject:
            Comment **deny**

            Workflow details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ==========================================
  # 4. CLOUDFLARE PRODUCTION DEPLOYMENT
  # ==========================================
  deploy:
    name: Production deployment
    runs-on: ubuntu-24.04

    needs:
      - build
      - approval

    timeout-minutes: 15

    if: ${{ needs.approval.result == 'success' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)) }}

    # Prevent overlapping production deployments
    concurrency:
      group: rd-ai-labs-production
      cancel-in-progress: false

    steps:
      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: website-dist
          path: dist/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name=rd-ai-labs-website \
            --branch=main

  # ==========================================
  # 5. FINAL DEPLOYMENT NOTIFICATION
  # ==========================================
  notify_deploy:
    name: Notify deployment result
    runs-on: ubuntu-24.04

    needs:
      - build
      - approval
      - deploy

    if: always() && needs.build.result != 'skipped'

    permissions:
      contents: write

    steps:
      - name: Comment final deployment result
        uses: actions/github-script@v8

        env:
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          APPROVAL: ${{ needs.approval.result }}

          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}

          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

        with:
          script: |
            const url = process.env.RUN_URL;
            const source = process.env.SOURCE_BRANCH;
            const target = process.env.TARGET_BRANCH;
            const run = process.env.RUN_NUMBER;

            let body;

            if (process.env.BUILD !== 'success') {

              body = `❌ PIPELINE STOPPED: BUILD FAILED

            Source branch: ${source}
            Target branch: ${target}
            Run number: #${run}

            Production was NOT deployed.

            Build logs:
            ${url}`;

            } else if (process.env.APPROVAL !== 'success') {

              body = `⛔ DEPLOYMENT NOT APPROVED

            Source branch: ${source}
            Target branch: ${target}
            Run number: #${run}

            Approval was denied, timed out or cancelled.

            Production was NOT deployed.

            Workflow:
            ${url}`;

            } else if (process.env.DEPLOY === 'success') {

              body = `🚀 PRODUCTION DEPLOYMENT SUCCESSFUL

            Source branch: ${source}
            Target branch: ${target}
            Run number: #${run}

            Website: https://www.rdailabs.com/

            Cloudflare Pages deployment completed successfully.

            Workflow:
            ${url}`;

            } else if (process.env.DEPLOY === 'skipped') {

              body = `⚠️ PRODUCTION DEPLOYMENT SKIPPED

            Source branch: ${source}
            Target branch: ${target}
            Run number: #${run}

            Production deployment did not run.

            Workflow:
            ${url}`;

            } else {

              body = `❌ PRODUCTION DEPLOYMENT FAILED

            Source branch: ${source}
            Target branch: ${target}
            Run number: #${run}

            Check Cloudflare deployment logs:
            ${url}`;
            }

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });
