
name: RD AI Labs - Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Build the website
  build:
    name: Build website
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout website code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: website-dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # 2. Notify build result
  notify_build:
    name: Notify build result
    runs-on: ubuntu-24.04
    needs: build
    if: always() && needs.build.result != 'skipped'
    permissions:
      contents: write

    steps:
      - name: Comment on commit
        uses: actions/github-script@v8
        env:
          RESULT: ${{ needs.build.result }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const url = process.env.RUN_URL;
            const branch = process.env.BRANCH;
            const run = process.env.RUN_NUMBER;

            const body = process.env.RESULT === 'success'
              ? `✅ BUILD SUCCESSFUL

            Branch: ${branch}
            Run number: #${run}

            Production deployment is waiting for your approval.

            Find the approval issue titled:
            "Deploy approval needed: ${branch} - run #${run}"

            Run: ${url}`
              : `❌ BUILD FAILED

            Branch: ${branch}
            Run number: #${run}

            Production was NOT deployed.

            Check the build logs:
            ${url}`;

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });

  # 3. Wait for manual approval
  approval:
    name: Wait for approval
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 120
    permissions:
      issues: write
      contents: read

    steps:
      - name: Wait for approval comment
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: rd-ai-labs,logalakshmidbn97-png
          minimum-approvals: 1

          issue-title: "Deploy approval needed: ${{ github.head_ref || github.ref_name }} - run #${{ github.run_number }}"

          issue-body: |
            🚀 RD AI Labs production deployment approval required.

            Branch: ${{ github.head_ref || github.ref_name }}
            Repository: ${{ github.repository }}
            Run number: #${{ github.run_number }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}

            Build succeeded. Production has NOT been deployed yet.

            Comment **approve** to deploy.
            Comment **deny** to cancel.

            Workflow details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # 4. Deploy to Cloudflare Pages
  deploy:
    name: Production deployment
    runs-on: ubuntu-24.04
    needs: [build, approval]
    timeout-minutes: 15

    if: github.ref == 'refs/heads/main'

    concurrency:
      group: rd-ai-labs-production
      cancel-in-progress: false

    steps:
      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: website-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=rd-ai-labs-website --branch=main

  # 5. Notify deployment result
  notify_deploy:
    name: Notify deployment result
    runs-on: ubuntu-24.04
    needs: [build, approval, deploy]
    if: always()

    permissions:
      contents: write

    steps:
      - name: Comment on commit
        uses: actions/github-script@v8
        env:
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          APPROVAL: ${{ needs.approval.result }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const url = process.env.RUN_URL;
            const branch = process.env.BRANCH;
            const run = process.env.RUN_NUMBER;

            let body;

            if (process.env.BUILD !== 'success') {
              body = `❌ PIPELINE STOPPED: BUILD FAILED

            Branch: ${branch}
            Run number: #${run}

            Production was NOT deployed.

            Build logs: ${url}`;

            } else if (process.env.APPROVAL !== 'success') {
              body = `⛔ DEPLOYMENT NOT APPROVED

            Branch: ${branch}
            Run number: #${run}

            Approval was denied, timed out or cancelled.
            Production was NOT deployed.

            Run: ${url}`;

            } else if (process.env.DEPLOY === 'success') {
              body = `🚀 PRODUCTION DEPLOYMENT SUCCESSFUL

            Branch: ${branch}
            Run number: #${run}

            Website: https://www.rdailabs.com/

            Cloudflare Pages deployment completed successfully.

            Run: ${url}`;

            } else {
              body = `❌ PRODUCTION DEPLOYMENT FAILED

            Branch: ${branch}
            Run number: #${run}

            Check the deployment logs:
            ${url}`;
            }

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });
