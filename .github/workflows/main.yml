
name: RD AI Labs - Build Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build React Website
    runs-on: ubuntu-latest

    steps:
      - name: Get website code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Save build output
        uses: actions/upload-artifact@v4
        with:
          name: rd-ai-labs-website
          path: dist/
          if-no-files-found: error
          retention-days: 7
